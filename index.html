<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>더블베이스</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f7f9;
    color: #222;
}

/* 위쪽 제목 부분 */
header {
    background: #dce6f7;
    text-align: center;
    padding: 55px 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

/* 아래 사진 부분 */
main {
    max-width: 780px;
    margin: 30px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.06);
}

.card h2 {
    margin-top: 0;
}

img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    margin-top: 15px;
}

</style>
</head>

<body>

<header>
    <h1>더블베이스</h1>
</header>

<main>

<div class="card">

    <h2>더블베이스 사진</h2>

    <img src="bass.png" alt="더블베이스 사진">

</div>

</main>

</body>
</html>
