<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 홈페이지</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f7f9;
    color: #222;
}

header {
    background: white;
    text-align: center;
    padding: 45px 20px;
}

main {
    max-width: 780px;
    margin: 30px auto;
    padding: 0 16px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.06);
}

.date {
    color: #999;
    font-size: 13px;
}

img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>내 홈페이지</h1>
    <p>나만의 사진과 기록을 남기는 공간</p>
</header>

<main>

<div class="card">
    <div class="date">2026.09.16</div>

    <h2>더블베이스</h2>

    <p>첫 번째 사진을 올렸습니다.</p>

    <img src="bass.png" alt="더블베이스 사진">
</div>

</main>

</body>
</html>
