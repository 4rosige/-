<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 홈페이지</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.7;
      color: #222;
    }
    h1 { margin-bottom: 8px; }
    .intro { color: #666; }
    img, video {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 12px;
    }
    .card {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <h1>내 홈페이지</h1>
  <p class="intro">나만의 사진과 기록을 남기는 공간입니다.</p>

  <div class="card">
    <h2>첫 번째 글</h2>
    <p>홈페이지 만들기 성공! 이 글은 index.html을 수정해서 바꿀 수 있습니다.</p>
  </div>

  <!-- 사진을 넣으려면 아래 예시의 주석을 지우세요.
  <div class="card">
    <h2>사진</h2>
    <img src="images/photo1.jpg" alt="내 사진">
  </div>
  -->

  <!-- 동영상을 넣으려면 아래 예시의 주석을 지우세요.
  <div class="card">
    <h2>동영상</h2>
    <video controls>
      <source src="videos/video1.mp4" type="video/mp4">
    </video>
  </div>
  -->
</body>
</html>
